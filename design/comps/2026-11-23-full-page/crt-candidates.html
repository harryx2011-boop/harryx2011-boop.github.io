<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work scene candidates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="crt.css">
<link rel="stylesheet" href="crt-os.css">
<style>
  .pick { padding-block: var(--s-6) var(--s-8); display: grid; gap: var(--s-7); }
  .pick > p { max-width: 62ch; font-size: 20px; line-height: 1.5; }
  .pick section { display: grid; gap: var(--s-3); }
  .pick .crt { margin: 0 auto; }
</style>
</head>
<body>
<main class="pick gut">
  <p>Three scenes, one computer. Windowsill: front on, ivy pouring over it from above. Forest floor: sunk into moss, with ferns and mushrooms. Root-bound: roots grip the case, a sapling grows from the top, a tower stands beside it.</p>
  <section><h2 class="title">Windowsill</h2>
    <div class="crt" data-scene="a"><canvas class="crt-back" aria-hidden="true"></canvas><div class="crt-screen" role="group" aria-label="An old computer showing Harry's work: the reveal film, the Night Market renders, a notes file and a terminal"></div><canvas class="crt-front" aria-hidden="true"></canvas></div></section>
  <section><h2 class="title">Forest floor</h2>
    <div class="crt" data-scene="b"><canvas class="crt-back" aria-hidden="true"></canvas><div class="crt-screen" role="group" aria-label="An old computer showing Harry's work: the reveal film, the Night Market renders, a notes file and a terminal"></div><canvas class="crt-front" aria-hidden="true"></canvas></div></section>
  <section><h2 class="title">Root-bound</h2>
    <div class="crt" data-scene="c"><canvas class="crt-back" aria-hidden="true"></canvas><div class="crt-screen" role="group" aria-label="An old computer showing Harry's work: the reveal film, the Night Market renders, a notes file and a terminal"></div><canvas class="crt-front" aria-hidden="true"></canvas></div></section>
</main>
<script src="crt-engine.js"></script>
<script src="crt-plants.js"></script>
<script src="crt-computer.js"></script>
<script src="crt-ground.js"></script>
<script src="crt-scenes.js"></script>
<script src="crt-scene.js"></script>
<script src="os-icons.js"></script>
<script src="os-apps.js"></script>
<script src="os.js"></script>
</body>
</html>
