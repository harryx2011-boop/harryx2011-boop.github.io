<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harry Xie</title>
<meta name="description" content="Harry Xie, founder of Aether. Building tools for the next frontier.">
<meta name="theme-color" content="#0b1a30">
<meta property="og:type" content="website">
<meta property="og:url" content="https://harryxie.me/">
<meta property="og:title" content="Harry Xie">
<meta property="og:description" content="Founder of Aether. Building tools for the next frontier.">
<link rel="canonical" href="https://harryxie.me/">
<link rel="icon" href="aether.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Calling card on the Aether horizon: the profile banner's sky, one name, one mark. */
  :root {
    --sky-top: #0b1a30;
    --sky-mid: #11304f;
    --sky-low: #1c5a8b;
    --ink: #eef8fa;
    --ink-soft: #b9d6e8;
    --ice: #71b1d7;
    --rule: rgba(238, 248, 250, 0.18);
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "Geist Mono", ui-monospace, Consolas, monospace;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --gutter: clamp(20px, 6vw, 96px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 48px;
    padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%) fixed, var(--sky-top);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    width: 52px;
    height: 52px;
    display: block;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  main { align-self: end; display: grid; gap: 20px; max-width: 46rem; }
  h1 {
    margin: 0;
    font-size: clamp(4rem, 11vw, 9rem);
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.025em;
  }
  .role {
    margin: 0;
    font-size: clamp(1.35rem, 2.6vw, 2rem);
    line-height: 1.3;
    color: var(--ink-soft);
    text-wrap: balance;
  }
  .role span { display: block; }
  .role em { color: var(--ink); font-style: italic; }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px 32px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }
  footer a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ice);
    padding-bottom: 2px;
    transition: border-color 160ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    footer a:hover { border-color: var(--ink); }
  }
  footer a:focus-visible { outline: 2px solid var(--ice); outline-offset: 4px; border-radius: 2px; }
  .site {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding-block: 10px;
    font-family: var(--mono);
    font-size: 0.9375rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--ice);
    text-decoration-thickness: 1px;
    text-underline-offset: 6px;
    transition: text-decoration-color 160ms ease;
  }
  .site svg { width: 17px; height: 17px; flex: none; fill: none; stroke: var(--ice); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) and (pointer: fine) {
    .site:hover { text-decoration-color: var(--ink); }
  }
  .site:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; border-radius: 2px; }
  .rise { animation: rise 700ms var(--ease-out) both; }
  .rise:nth-child(2) { animation-delay: 60ms; }
  .rise:nth-child(3) { animation-delay: 120ms; }
  footer.rise { animation-delay: 180ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: fade 300ms ease both; }
    @keyframes fade { from { opacity: 0; } }
  }
</style>
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 512 512" role="img" aria-label="Aether">
      <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0b1a2d"/>
          <stop offset="100%" stop-color="#03070a"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#tile)"/>
      <g stroke="#050c17" stroke-width="3" stroke-linejoin="round">
        <polygon points="256,118 366,182 224,236 146,182" fill="#eef8fa"/>
        <polygon points="366,182 366,310 224,236" fill="#1c5a8b"/>
        <polygon points="146,182 224,236 146,310" fill="#71b1d7"/>
        <polygon points="366,310 256,374 146,310 224,236" fill="#0a1930"/>
      </g>
    </svg>
  </header>
  <main>
    <h1 class="rise">Harry Xie</h1>
    <p class="role rise"><span>Founder of <em>Aether</em>.</span> <span>Building tools for the next frontier.</span></p>
    <a class="site rise" href="https://aether-labs.dev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      aether-labs.dev
    </a>
  </main>
  <footer class="rise">
    <span>&copy; 2026 Harry Xie</span>
    <a href="https://github.com/harryx2011-boop">GitHub</a>
  </footer>
</body>
</html>
